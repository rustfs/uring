name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: ABBA evidence gate tests
        run: python3 -m unittest discover -s scripts -p 'test_bench_abba.py' -v

  test:
    name: test (real io_uring on runner)
    runs-on: ubuntu-latest
    env:
      URING_REQUIRE_DIRECT: "1"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build tests
        run: cargo build --locked --tests --all-features
      - name: Test and assert io_uring actually ran
        run: |
          set -o pipefail
          cargo test --locked --all-features -- --nocapture --test-threads=1 2>&1 | tee test.out
          if grep -q "SKIP " test.out; then
            echo "::error::a test skipped — io_uring did not run on this runner (vacuous pass)"
            exit 1
          fi
          grep -q "DIRECT_OK direct_read_returns_exact_unaligned_ranges" test.out
      - name: Ordered-prefetch contract smoke (real io_uring)
        run: bash scripts/test-ordered-prefetch-cli.sh
      - name: Benchmark schema and correctness smoke
        run: bash scripts/test-benchmark-cli.sh
      - name: Instrumented benchmark schema and correctness smoke
        env:
          BENCH_DIAGNOSTICS: "1"
        run: bash scripts/test-benchmark-cli.sh

  docker-two-legs:
    name: docker (degradation + real io_uring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: run-docker.sh (leg 1 degrades, leg 2 real io_uring)
        run: ./run-docker.sh
